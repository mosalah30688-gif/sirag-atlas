name: Build Sirag Atlas Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Web Bundle to Android
        run: npm run android:sync

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sirag-atlas-seerah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirag-atlas-seerah-apk
          path: sirag-atlas-seerah.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "سراج أطلس السيرة النبوية ${{ github.ref_name }}"
          body: |
            ## 🕌 تطبيق سراج أطلس السيرة النبوية ﷺ (${{ github.ref_name }})
            - **اسم التطبيق:** سراج أطلس السيرة النبوية (`com.sirag.atlas.seerah`)
            - **العمل بدون إنترنت:** أوفلاين بالكامل شاملاً الخرائط التفاعلية، محاكي الغزوات، مجرة الصحابة، الديوان المسموع، والوثائق النبوية.
          files: sirag-atlas-seerah.apk
